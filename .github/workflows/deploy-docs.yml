# GitHub Actions workflow to deploy Astro docs to GitHub Pages
# See: https://docs.astro.build/en/guides/deploy/github/

name: Deploy Docs to GitHub Pages

on:
  # Runs on pushes targeting the main branch
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/deploy-docs.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the sitemap's <lastmod> is each page's last commit.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: bun install

      - name: Build renderer
        run: bun run build
        working-directory: ./packages/renderer

      - name: Build docs
        run: bun run build
        working-directory: ./packages/website

      # What actions/upload-pages-artifact does, minus its `--exclude=".[^/]*"`,
      # which would drop /.well-known/ (the Agent Skills index).
      - name: Archive site
        run: tar --dereference --hard-dereference --directory ./packages/website/dist -cvf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
